name: Evals

# The end-to-end evals (evals/README.md), opt-in only: a run costs real tokens and minutes, so
# nothing starts it but a person, by hand or with the `eval` label on a pull request (quick,
# against the PR's base). Never a merge gate. Needs one of two secrets (evals/README.md, Run):
# CLAUDE_CODE_OAUTH_TOKEN, a subscription token from `claude setup-token`, which Claude Code
# reads from that variable only, or ANTHROPIC_API_KEY, a Console API key.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      tasks:
        description: "Tasks: `quick` (one per lane), `all`, or task names separated by spaces"
        default: quick
      runs:
        description: Runs per task
        default: "1"
      base:
        description: "Optional ref to compare against (a branch, tag or SHA); empty scores this ref alone"
        default: ""

permissions: {}

# One eval at a time: two would share the API key's rate limit and skew the timings.
concurrency:
  group: evals

jobs:
  evals:
    # A label run needs the `eval` label; any other label starts nothing.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # Inputs reach the shell as variables, never as ${{ }} text inside a script.
      # A label run has no inputs: quick, once, against the PR's base branch.
      TASKS: ${{ inputs.tasks || 'quick' }}
      RUNS: ${{ inputs.runs || '1' }}
      BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || inputs.base }}
      # A runner has no git identity, and the session commits; run.sh sets one only for the
      # fixture's first commit.
      GIT_AUTHOR_NAME: eval
      GIT_AUTHOR_EMAIL: eval@example.invalid
      GIT_COMMITTER_NAME: eval
      GIT_COMMITTER_EMAIL: eval@example.invalid
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base ref, when given, is checked out beside this one.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the inputs and the key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          [ "$HAS_KEY" = true ] || { echo "::error::Set the ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN repository secret first."; exit 1; }
          [[ "$RUNS" =~ ^[1-9][0-9]?$ ]] || { echo "::error::runs must be a whole number from 1 to 99."; exit 1; }
          [[ "$TASKS" =~ ^[a-z0-9\ -]+$ ]] || { echo "::error::tasks must be \`quick\`, \`all\` or task names."; exit 1; }
          if [ -n "$BASE" ]; then
            git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null ||
              git rev-parse --verify --quiet "origin/$BASE^{commit}" >/dev/null ||
              { echo "::error::base $BASE is not a ref in this repository."; exit 1; }
          fi

      - name: Install the .NET 10 SDK and Claude Code
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >>"$GITHUB_PATH"
          npm install -g @anthropic-ai/claude-code

      - name: Run the base
        if: env.BASE != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          ref="$BASE"
          git rev-parse --verify --quiet "$ref^{commit}" >/dev/null || ref="origin/$BASE"
          git worktree add --detach "$RUNNER_TEMP/base" "$ref"
          # shellcheck disable=SC2086 # TASKS is a list of names, checked above.
          CREW_EVAL_PLUGIN="$RUNNER_TEMP/base/plugin" bash evals/run.sh -n "$RUNS" $TASKS | tee "$RUNNER_TEMP/base.log"

      - name: Run this ref
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # TASKS is a list of names, checked above.
          bash evals/run.sh -n "$RUNS" $TASKS | tee "$RUNNER_TEMP/head.log"

      - name: Score
        if: always()
        run: |
          set -uo pipefail
          # No base.log without a base: Actions runs bash with -e, so a missing log must not fail.
          summary() { sed -n 's/^results: //p' "$RUNNER_TEMP/$1.log" 2>/dev/null || true; }
          head="$(summary head)"
          base="$(summary base)"
          [ -n "$head" ] || { echo "::error::No results from this ref; see the run step's log."; exit 1; }
          # Every failed run's criteria, and how its session ended, so a failure in the
          # environment reads apart from a wrong change, without a rerun.
          failures() {  # <side> <summary.jsonl>
            for log in "$(dirname "$2")"/*/grade.log; do
              grep -q '^FAIL' "$log" || continue
              run="$(dirname "$log")"
              printf '\n<details><summary>%s %s</summary>\n\n```\n' "$1" "$(basename "$run")"
              grep '^FAIL' "$log"
              echo '--- session'
              jq -r '"\(.subtype // "no result") error=\(if .is_error == null then "-" else .is_error end) turns=\(.num_turns // "-")",
                (.result // "" | tostring | .[0:800])' "$run/session.json" 2>/dev/null ||
                head -c 800 "$run/session.json" 2>/dev/null || true
              # What the session's permissions refused: an eval allow-list gap reads as a crew failure.
              jq -r '.permission_denials[]? | "denied \(.tool_name): \(.tool_input.command // (.tool_input | tostring) | .[0:200])"' \
                "$run/session.json" 2>/dev/null || true
              # Refusals inside workers reach only the permission log (evals/permission-log.sh).
              jq -r '"request \(.agent) \(.tool): \(.input)"' "$run/permission-requests.jsonl" 2>/dev/null || true
              tail -n 20 "$run/session.err" 2>/dev/null || true
              printf '```\n</details>\n'
            done
          }
          # A passing run can still have been refused a call, at a cost in turns: list those too.
          refusals() {  # <side> <summary.jsonl>
            for log in "$(dirname "$2")"/*/grade.log; do
              run="$(dirname "$log")"
              ! grep -q '^FAIL' "$log" && [ -s "$run/permission-requests.jsonl" ] || continue
              printf '\n<details><summary>%s %s passed, with refused requests</summary>\n\n```\n' "$1" "$(basename "$run")"
              jq -r '"request \(.agent) \(.tool): \(.input)"' "$run/permission-requests.jsonl" 2>/dev/null || true
              printf '```\n</details>\n'
            done
          }
          {
            echo "## Evals: $GITHUB_REF_NAME${BASE:+ against $BASE}"
            echo
            echo "$(claude --version), $RUNS runs per task"
            echo
            echo '```'
            if [ -n "$base" ]; then bash evals/score.sh "$base" "$head" 2>&1; else bash evals/score.sh "$head"; fi
            echo '```'
            if [ -n "$base" ]; then failures base "$base"; refusals base "$base"; fi
            failures "$GITHUB_REF_NAME" "$head"
            refusals "$GITHUB_REF_NAME" "$head"
          } | tee -a "$GITHUB_STEP_SUMMARY"  # the log too: the API serves logs, not summaries
