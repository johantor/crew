name: Validate

# Push runs are limited to main: every other branch gets validated through its
# pull_request events, so a bare `push` trigger would run everything twice per
# PR commit.
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

# Cancel superseded runs on rapid pushes to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The shell's `*` does not cross directory separators (git's does), so the
      # sourced libraries under plugin/hooks/lib/ need their own pattern here.
      - name: Lint shell files
        run: shellcheck plugin/hooks/*.sh plugin/hooks/lib/*.sh plugin/scripts/*.sh tests/*.sh scripts/*.sh

  plugin:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate plugin manifest & structure
        run: scripts/validate-plugin.sh

  # Diff-based, so it only runs where there is a base branch to diff against —
  # the push-to-main run has nothing to compare and would compare against
  # itself. Its own job rather than a validate-plugin.sh section because that
  # script is deliberately tree-only (it runs locally, mid-branch, with no base).
  changelog:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the target branch has to be reachable; a shallow
          # clone of the PR head alone cannot produce one.
          fetch-depth: 0
      - name: Shipped changes carry release notes
        run: scripts/check-changelog.sh "${{ github.base_ref }}"

  tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every suite: the guards, the gate runner, the validator, and the release scripts.
      - name: Tests
        run: |
          fail=0
          for t in tests/*.test.sh; do echo "== $t"; bash "$t" || fail=1; done
          exit "$fail"
