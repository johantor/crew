<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session Board</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/board.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <!-- The icons are inline: the CSP loads no image files. app.mjs uses them with <use>. -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M9 7v6M15 7v10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-branch" viewBox="0 0 24 24"><path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M10.7 5.1A10 10 0 0 1 12 5c5 0 9 7 9 7a17 17 0 0 1-2.2 3.1"/><path d="M6.6 6.6C3.9 8.3 3 12 3 12s4 7 9 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></symbol>
  </svg>
  <header class="bar">
    <h1><svg class="icon logo" aria-hidden="true"><use href="#i-board"/></svg>Session Board</h1>
    <div class="filters">
      <label class="search">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="Search title, repo, branch" aria-label="Search" aria-keyshortcuts="/">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <select id="repo" aria-label="Repository"><option value="">All repos</option></select>
      <label class="check"><input id="archived" type="checkbox"><svg class="icon" aria-hidden="true"><use href="#i-eye-off"/></svg>Hidden</label>
    </div>
    <div class="theme" role="group" aria-label="Theme">
      <button type="button" data-theme-choice="auto" aria-label="Auto theme" title="Auto"><svg class="icon" aria-hidden="true"><use href="#i-monitor"/></svg></button>
      <button type="button" data-theme-choice="light" aria-label="Light theme" title="Light"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button>
      <button type="button" data-theme-choice="dark" aria-label="Dark theme" title="Dark"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>
    </div>
    <span id="live" class="live" role="status" title="Live updates">offline</span>
  </header>
  <main id="board" class="board"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
