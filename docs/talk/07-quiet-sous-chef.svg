<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22201C"/></marker></defs><rect width="1920" height="1080" fill="#F5EFE3"/><text x="120" y="150" font-family="Inter Display" font-size="76" font-weight="700" fill="#22201C" text-anchor="start" >A sous chef who doesn't talk much</text><text x="120" y="215" font-family="Inter" font-size="34" font-weight="400" fill="#7D776B" text-anchor="start" >Direct answers. The work goes to a station on the next tick.</text>
<rect x="602" y="290" width="478" height="70" rx="35" fill="#C8472B" stroke="none" stroke-width="2"/><text x="637" y="335" font-family="Inter" font-size="28" font-weight="400" fill="#fff" text-anchor="start" >Add a newsletter signup.</text><rect x="200" y="386" width="665" height="70" rx="35" fill="#FFFDF8" stroke="#D9D0BE" stroke-width="2"/><text x="235" y="431" font-family="Inter" font-size="28" font-weight="400" fill="#22201C" text-anchor="start" >Plan ready. 4 steps, 4 workers. Go?</text><text x="180" y="431" font-family="JetBrains Mono" font-size="20" font-weight="400" fill="#7D776B" text-anchor="end" >lead</text><rect x="959" y="482" width="121" height="70" rx="35" fill="#C8472B" stroke="none" stroke-width="2"/><text x="994" y="527" font-family="Inter" font-size="28" font-weight="400" fill="#fff" text-anchor="start" >Go.</text><rect x="200" y="578" width="835" height="70" rx="35" fill="#FFFDF8" stroke="#D9D0BE" stroke-width="2"/><text x="235" y="623" font-family="Inter" font-size="28" font-weight="400" fill="#22201C" text-anchor="start" >Step 1 to backend. Running in the background.</text><text x="180" y="623" font-family="JetBrains Mono" font-size="20" font-weight="400" fill="#7D776B" text-anchor="end" >lead</text><rect x="200" y="674" width="801" height="70" rx="35" fill="#FFFDF8" stroke="#D9D0BE" stroke-width="2"/><text x="235" y="719" font-family="Inter" font-size="28" font-weight="400" fill="#22201C" text-anchor="start" >Step 1 done: a1f3c9e. Step 2 to unit-tests.</text><text x="180" y="719" font-family="JetBrains Mono" font-size="20" font-weight="400" fill="#7D776B" text-anchor="end" >lead</text><rect x="517" y="770" width="563" height="70" rx="35" fill="#C8472B" stroke="none" stroke-width="2"/><text x="552" y="815" font-family="Inter" font-size="28" font-weight="400" fill="#fff" text-anchor="start" >Make the button text shorter.</text><rect x="200" y="866" width="631" height="70" rx="35" fill="#FFFDF8" stroke="#D9D0BE" stroke-width="2"/><text x="235" y="911" font-family="Inter" font-size="28" font-weight="400" fill="#22201C" text-anchor="start" >Noted. Added to step 3, frontend.</text><text x="180" y="911" font-family="JetBrains Mono" font-size="20" font-weight="400" fill="#7D776B" text-anchor="end" >lead</text>
<text x="1260" y="360" font-family="Inter" font-size="32" font-weight="700" fill="#22201C" text-anchor="start" >Background by default</text><text x="1260" y="400" font-family="Inter" font-size="26" font-weight="400" fill="#7D776B" text-anchor="start" >lead stays free to talk</text>
<text x="1260" y="500" font-family="Inter" font-size="32" font-weight="700" fill="#22201C" text-anchor="start" >One tick, one handoff</text><text x="1260" y="540" font-family="Inter" font-size="26" font-weight="400" fill="#7D776B" text-anchor="start" >my word goes to the right station</text>
<text x="1260" y="640" font-family="Inter" font-size="32" font-weight="700" fill="#22201C" text-anchor="start" >Plain words</text><text x="1260" y="680" font-family="Inter" font-size="26" font-weight="400" fill="#7D776B" text-anchor="start" >ASD-STE-100 to the operator</text>
<text x="1260" y="780" font-family="Inter" font-size="32" font-weight="700" fill="#22201C" text-anchor="start" >Nothing leaves by itself</text><text x="1260" y="820" font-family="JetBrains Mono" font-size="26" font-weight="400" fill="#7D776B" text-anchor="start" >/crew:pr, and I run it</text></svg>