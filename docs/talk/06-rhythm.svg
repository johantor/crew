<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#22201C"/></marker></defs><rect width="1920" height="1080" fill="#F5EFE3"/><text x="120" y="150" font-family="Inter Display" font-size="76" font-weight="700" fill="#22201C" text-anchor="start" >The rhythm</text><text x="120" y="215" font-family="Inter" font-size="34" font-weight="400" fill="#7D776B" text-anchor="start" >Plan briefly. Build slowly. Show. Then harden.</text>
<rect x="120" y="420" width="284" height="150" rx="16" fill="#D99A2B"/><text x="144" y="480" font-family="Inter" font-size="34" font-weight="700" fill="#fff" text-anchor="start" >Mise en place</text><text x="144" y="525" font-family="Inter" font-size="24" font-weight="400" fill="#fff" text-anchor="start" opacity=".85">~10 min</text><text x="144" y="630" font-family="Inter" font-size="24" font-weight="400" fill="#22201C" text-anchor="start" >plan checkpoint</text><rect x="420" y="420" width="544" height="150" rx="16" fill="#C8472B"/><text x="444" y="480" font-family="Inter" font-size="34" font-weight="700" fill="#fff" text-anchor="start" >Service</text><text x="444" y="525" font-family="Inter" font-size="24" font-weight="400" fill="#fff" text-anchor="start" opacity=".85">slow, methodical</text><text x="444" y="630" font-family="Inter" font-size="24" font-weight="400" fill="#22201C" text-anchor="start" >one verified commit per step</text><circle cx="480" cy="700" r="16" fill="#5E7F63"/><path d="M472,700 L478,706 L488,694" stroke="#fff" stroke-width="3" fill="none"/><circle cx="560" cy="700" r="16" fill="#5E7F63"/><path d="M552,700 L558,706 L568,694" stroke="#fff" stroke-width="3" fill="none"/><circle cx="640" cy="700" r="16" fill="#5E7F63"/><path d="M632,700 L638,706 L648,694" stroke="#fff" stroke-width="3" fill="none"/><circle cx="720" cy="700" r="16" fill="#5E7F63"/><path d="M712,700 L718,706 L728,694" stroke="#fff" stroke-width="3" fill="none"/><circle cx="800" cy="700" r="16" fill="#5E7F63"/><path d="M792,700 L798,706 L808,694" stroke="#fff" stroke-width="3" fill="none"/><circle cx="880" cy="700" r="16" fill="#5E7F63"/><path d="M872,700 L878,706 L888,694" stroke="#fff" stroke-width="3" fill="none"/><text x="444" y="760" font-family="Inter" font-size="22" font-weight="400" fill="#7D776B" text-anchor="start" >each step: verify, then commit</text><rect x="980" y="420" width="284" height="150" rx="16" fill="#5E7F63"/><text x="1004" y="480" font-family="Inter" font-size="34" font-weight="700" fill="#fff" text-anchor="start" >Taste</text><text x="1004" y="525" font-family="Inter" font-size="24" font-weight="400" fill="#fff" text-anchor="start" opacity=".85">show and verify</text><text x="1004" y="630" font-family="Inter" font-size="24" font-weight="400" fill="#22201C" text-anchor="start" >the chef looks</text><rect x="1280" y="420" width="304" height="150" rx="16" fill="#22201C"/><text x="1304" y="480" font-family="Inter" font-size="34" font-weight="700" fill="#fff" text-anchor="start" >The pass</text><text x="1304" y="525" font-family="Inter" font-size="24" font-weight="400" fill="#fff" text-anchor="start" opacity=".85">harden</text><text x="1304" y="630" font-family="Inter" font-size="24" font-weight="400" fill="#22201C" text-anchor="start" >a11y · security · visual</text><text x="1304" y="700" font-family="JetBrains Mono" font-size="28" font-weight="700" fill="#C8472B" text-anchor="start" >GO / NO-GO</text><rect x="1600" y="420" width="184" height="150" rx="16" fill="#C8472B"/><text x="1624" y="480" font-family="Inter" font-size="34" font-weight="700" fill="#fff" text-anchor="start" >Out</text><text x="1624" y="525" font-family="Inter" font-size="24" font-weight="400" fill="#fff" text-anchor="start" opacity=".85">chef only</text><text x="1624" y="630" font-family="Inter" font-size="24" font-weight="400" fill="#22201C" text-anchor="start" >/crew:pr</text>
<rect x="120" y="830" width="1680" height="120" rx="18" fill="#FFFDF8" stroke="#D9D0BE" stroke-width="2" /><text x="160" y="903" font-family="Inter" font-size="38" font-weight="700" fill="#22201C" text-anchor="start" >Requirements early. Verification late.</text><text x="960" y="903" font-family="Inter" font-size="26" font-weight="400" fill="#7D776B" text-anchor="start" >A11y and security come last: the process can still change.</text></svg>