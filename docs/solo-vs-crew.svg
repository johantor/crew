<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Inter, 'Inter Tight', Helvetica, Arial, sans-serif">
  <title>A solo agent juggling every concern, versus the crew: planned lanes, a review gate, then a pull request</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e6b55"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="#f6f4ef"/>

  <!-- ============ LEFT: solo agent ============ -->
  <rect x="24" y="24" width="552" height="512" rx="24" fill="#ffffff" stroke="#e2ded4"/>
  <text x="56" y="76" font-size="30" font-weight="900" letter-spacing="-1" fill="#0c0c1d">One agent</text>
  <text x="56" y="102" font-size="15" fill="#5d6070">every concern in one head</text>

  <g fill="none" stroke="#b9b6c8" stroke-width="1.6">
    <path d="M300,190 C 120,130 60,390 120,310"/>
    <path d="M300,190 C 480,120 540,410 470,310"/>
    <path d="M300,190 C 140,430 420,200 280,360"/>
    <path d="M300,190 C 520,270 120,310 200,440"/>
    <path d="M300,190 C 60,250 500,440 420,410"/>
  </g>
  <g fill="none" stroke="#b4541f" stroke-width="1.8">
    <path d="M170,325 C 320,240 220,440 330,367"/>
    <path d="M470,325 C 300,390 380,250 210,442"/>
  </g>
  <text x="296" y="302" font-size="16" font-weight="900" fill="#b4541f">×</text>
  <text x="328" y="392" font-size="16" font-weight="900" fill="#b4541f">×</text>

  <circle cx="300" cy="170" r="34" fill="#0c0c1d"/>
  <text x="300" y="176" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">agent</text>

  <g font-size="14" font-weight="600" text-anchor="middle" fill="#2a2b3a">
    <rect x="70"  y="295" width="100" height="32" rx="16" fill="#efece4"/><text x="120" y="316">backend</text>
    <rect x="420" y="295" width="100" height="32" rx="16" fill="#efece4"/><text x="470" y="316">frontend</text>
    <rect x="230" y="352" width="100" height="32" rx="16" fill="#efece4"/><text x="280" y="373">tests</text>
    <rect x="150" y="427" width="100" height="32" rx="16" fill="#efece4"/><text x="200" y="448">e2e</text>
    <rect x="370" y="395" width="100" height="32" rx="16" fill="#efece4"/><text x="420" y="416">review</text>
    <rect x="80"  y="370" width="90"  height="32" rx="16" fill="#efece4"/><text x="125" y="391">git</text>
  </g>

  <rect x="56" y="490" width="300" height="12" rx="6" fill="#efece4"/>
  <rect x="56" y="490" width="288" height="12" rx="6" fill="#b4541f"/>
  <text x="370" y="501" font-size="14" font-weight="700" fill="#b4541f">context 97%</text>

  <!-- ============ RIGHT: the crew ============ -->
  <rect x="624" y="24" width="552" height="512" rx="24" fill="#ffffff" stroke="#e2ded4"/>
  <text x="656" y="76" font-size="30" font-weight="900" letter-spacing="-1" fill="#0c0c1d">The crew</text>
  <text x="656" y="102" font-size="15" fill="#5d6070">planned lanes · verified steps · one gate</text>

  <rect x="836" y="124" width="128" height="40" rx="20" fill="#2f3bff"/>
  <text x="900" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">lead</text>

  <g fill="none" stroke="#2f3bff" stroke-width="1.8" opacity="0.55">
    <path d="M870,164 C 800,200 730,214 700,240"/>
    <path d="M885,164 C 850,200 810,218 801,240"/>
    <path d="M900,164 L 900,240"/>
    <path d="M915,164 C 950,200 990,218 999,240"/>
    <path d="M930,164 C 1000,200 1070,214 1100,240"/>
  </g>

  <g font-size="13" font-weight="700" text-anchor="middle" fill="#0c0c1d">
    <rect x="652"  y="242" width="96" height="34" rx="17" fill="#e3e4ff"/><text x="700"  y="264">backend</text>
    <rect x="753"  y="242" width="96" height="34" rx="17" fill="#e3e4ff"/><text x="801"  y="264">frontend</text>
    <rect x="852"  y="242" width="96" height="34" rx="17" fill="#e3e4ff"/><text x="900"  y="264">unit-tests</text>
    <rect x="951"  y="242" width="96" height="34" rx="17" fill="#e3e4ff"/><text x="999"  y="264">e2e</text>
    <rect x="1052" y="242" width="96" height="34" rx="17" fill="#e3e4ff"/><text x="1100" y="264">visual-review</text>
  </g>

  <g fill="none" stroke="#2f3bff" stroke-width="1.8" opacity="0.55">
    <path d="M700,276 C 700,320 770,340 800,360"/>
    <path d="M801,276 C 801,318 830,340 845,360"/>
    <path d="M900,276 L 900,360"/>
    <path d="M999,276 C 999,318 970,340 955,360"/>
    <path d="M1100,276 C 1100,320 1030,340 1000,360"/>
  </g>

  <path d="M964,144 C 1150,170 1168,290 1030,374" fill="none" stroke="#b4541f" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="1100" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#b4541f" stroke="#ffffff" stroke-width="5" paint-order="stroke">generalist</text>
  <text x="1100" y="213" text-anchor="middle" font-size="12" fill="#5d6070" stroke="#ffffff" stroke-width="5" paint-order="stroke">express lane</text>

  <rect x="776" y="362" width="248" height="44" rx="22" fill="#ddf1ea"/>
  <text x="900" y="390" text-anchor="middle" font-size="16" font-weight="800" fill="#0e6b55">review gate · GO ✓</text>

  <path d="M900,406 L900,446" fill="none" stroke="#0e6b55" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="840" y="452" width="120" height="38" rx="19" fill="#0c0c1d"/>
  <text x="900" y="477" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">PR #42</text>
</svg>
